
services:
    redis:
        image: redis:7.2-alpine
        container_name: redis
        networks: 
            - db-net

    db:
        container_name: db
        image: postgres:16.3-alpine
        volumes:
            - ./health/data/db:/var/lib/postgresql/data
        labels:
            - app_label.model_name=postgres
        environment:
            - POSTGRES_DB=${DB:-db}
            - POSTGRES_DB_NAME=${DB_NAME:-db}
            - POSTGRES_USER=${DB_USER:-postgres}
            - POSTGRES_PASSWORD=${DB_PASSWORD:-postgres}
        networks: 
            - db-net

    mosquitto:
        image: eclipse-mosquitto:2.0
        hostname: mosquitto
        container_name: mosquitto
        ports:
            - "1883:1883"
        # Solo si existe mosquitto.conf en esa ruta
        volumes:
            - ./health/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
        networks:
            - db-net

    myapp:
        container_name: app
        restart: always
        image: gottigjavier/health-slim:24.07.18
        ports:
            - "8000:8000"
        environment:
            - POSTGRES_DB=${DB:-db}
            - POSTGRES_DB_NAME=${DB_NAME:-db}
            - POSTGRES_USER=${DB_USER:-postgres}
            - POSTGRES_PASSWORD=${DB_PASSWORD:-postgres}
        depends_on:
            - db
            - redis
            - mosquitto
        networks: 
            - db-net
        links:
            - db:db
        entrypoint: ["/bin/sh","-c"]
        command:
            - |
                python3 manage.py wait_for_db
                python3 manage.py migrate auth
                python3 manage.py migrate --run-syncdb
                echo "from django.contrib.auth import get_user_model; User = get_user_model(); User.objects.filter(username='admin').delete(); User.objects.create_superuser('admin', 'admin@project.com', 'password')" | python manage.py shell
                python3 manage.py collectstatic --clear --no-input
                daphne -b 0.0.0.0 -p 8000 healthproject.asgi:application

networks: 
    db-net:
        ipam:
            driver: default
            config:
                - subnet: 10.10.8.0/22
